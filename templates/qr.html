<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>QR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  // volta à raiz depois de 4s
  setTimeout(()=>{ window.location.href = "/"; }, 4000);
</script>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h2>Identificado</h2>
      {% if imageUrl %}
        <img src="{{ imageUrl }}" alt="Imagem" style="max-width:300px;">
      {% endif %}
    </div>
  </div>
</body>
</html>
