<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Cadastro</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Nome do aluno" required>
            <input type="password" name="pin" placeholder="PIN numérico" required>
            <input type="text" name="qr_code" placeholder="URL do QR Code" required>
            <button type="submit">Cadastrar</button>
        </form>
        <a href="/">Voltar ao login</a>
    </div>
</body>
</html>
